#   tls.secretName              -> tls.certificateRefs[].name
#   paths[].path: /             -> matches[].path PathPrefix /
#   proxy-body-size: 30m        -> BackendTrafficPolicy.requestBuffer.limit
#   ssl-redirect (implicite)    -> route `redirect-to-https` de la platform-gateway
