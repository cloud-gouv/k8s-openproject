# see https://github.com/opf/helm-charts/blob/main/charts/openproject/values.yaml

global: {}

# https://hub.docker.com/r/openproject/openproject/tags
image:
  repository: openproject/openproject
  sha256: "2d9a77fd8b7781ee3fea84ac232dd449c21ac4f84720b2e3019e8b1a0003684e" #tag 17.9.8-slim

dbInit:
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "1"
      memory: "256Mi"

appInit:
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

networkPolicy:
  enabled: false

memcached:
  bundled: true
  image:
    repository: bitnamilegacy/memcached
    tag: 1.6.24-debian-12-r0
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "2"
  networkPolicy:
    enabled: false
  metrics:
    enabled: true
    image:
      repository: bitnamilegacy/memcached-exporter
      tag: 0.14.2-debian-12-r10
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"
      limits:
        memory: "1Gi"
        cpu: "2"
    serviceMonitor:
      enabled: true

hocuspocus:
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "2"

openproject:
  https: true
  hsts: true
  host: "openproject.interne.numerique.gouv.fr"
  seed_locale: "fr"

  admin_user:
    # password is encrypted in environments/prod/secrets.enc.yaml
    password_reset: "true"
    name: "admin"
    mail: "openproject-prd@opicloud.numerique.gouv.fr"

  useTmpVolumes: false

persistence:
  enabled: false
  accessModes:
    - ReadWriteOnce
  storageClassName: "bsu-gp2"
  size: 5Gi

s3:
  # S3 is required for attachment storage when storageClass does not
  # support ReadWriteMany
  enabled: true

  region: cloudgouv-eu-west-1
  bucketName: openproject

  endpoint: https://oos.cloudgouv-eu-west-1.outscale.com
  host: oos.cloudgouv-eu-west-1.outscale.com
  port: 443
  pathStyle: true
  signatureVersion: 4
  enableSignatureV4Streaming: false

  directUploads: false

podSecurityContext:
  enabled: true
  fsGroup: 1000

containerSecurityContext:
  enabled: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - "ALL"
  seccompProfile:
    type: "RuntimeDefault"
  readOnlyRootFilesystem: false
  runAsNonRoot: true

postgresql:
  bundled: false
  connection:
    host: cnpg-cluster-openproject-rw
    port: 5432
  auth:
    existingSecret: "cnpg-cluster-openproject-app"
    username: "openproject"
    database: "openproject"
    secretKeys:
      userPasswordKey: "password"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

metrics:
  enabled: true
  path: "/metrics"
  port: 9394
  serviceMonitor:
    enabled: true

seederJob:
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "4"
    memory: 4Gi

gateway:
  enabled: true
  host: openproject.interne.numerique.gouv.fr
